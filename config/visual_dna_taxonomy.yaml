  - ease_in_out_cubic
  - ease_out_cubic
  - ease_in_cubic
  - spring_soft
  - spring_snappy
  - step
  - other

camera_rigs:
  - overhead
  - macro_slider
  - ui_plate
  - virtual_orthographic_2_5d
  - locked_tripod
  - other

motion_energy:
  - calm
  - low
  - medium
  - high
  - hyper

style_tensions:
  minimal_orbit_vs_portal_glass:
    resolution: mode_separation
    shared_bridge: circular_orbital_transition_grammar
    forbidden_default: fifty_fifty_blend
  flat_stroke_vs_soft_3d:
    resolution: choose_primary_mode_per_scene
  single_accent_vs_gradient:
    resolution: one_gradient_per_scene_and_one_hero_emphasis
