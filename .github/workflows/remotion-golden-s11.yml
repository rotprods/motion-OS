name: Remotion Golden S11
on:
  pull_request:
    paths:
      - 'runtime/remotion/src/golden_s11/**'
      - 'runtime/remotion/src/Root.tsx'
      - 'runtime/remotion/package.json'
      - 'scripts/verify_s11_golden.py'
      - 'tests/test_s11_golden_contract.py'
      - 'forensics/references/screenrecording_20260826/golden/s11/**'
      - '.github/workflows/remotion-golden-s11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Install pinned Remotion runtime
        working-directory: runtime/remotion
        run: npm install --no-audit --no-fund
      - name: Contract and type checks
        run: |
          python -m pytest -q tests/test_s11_golden_contract.py
          cd runtime/remotion
          npx tsc --noEmit
          npx remotion compositions src/index.ts
      - name: Render physical S11 structural fixture
        working-directory: runtime/remotion
        run: |
          mkdir -p out
          npx remotion render src/index.ts GoldenS11UiList out/golden-s11.mp4 --codec=h264 --log=verbose
      - name: Render transparent S11 editorial overlay
        working-directory: runtime/remotion
        run: |
          rm -rf out/golden-s11-overlay
          npx remotion render src/index.ts GoldenS11Overlay out/golden-s11-overlay --sequence --image-format=png --log=verbose
          test "$(find out/golden-s11-overlay -type f -name '*.png' | wc -l)" -eq 130
      - name: Verify exact mechanical and structural contract
        run: |
          python scripts/verify_s11_golden.py \
            --video runtime/remotion/out/golden-s11.mp4 \
            --out .artifacts/golden-s11/render_evidence.json \
            --samples-dir .artifacts/golden-s11/frames
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remotion-golden-s11-proof
          if-no-files-found: error
          path: |
            runtime/remotion/out/golden-s11.mp4
            runtime/remotion/out/golden-s11-overlay/**/*.png
            .artifacts/golden-s11/render_evidence.json
            .artifacts/golden-s11/frames/*.png
          retention-days: 14
