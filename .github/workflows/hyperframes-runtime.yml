name: HyperFrames Runtime

on:
  pull_request:
    paths:
      - 'src/compilers/hyperframes.py'
      - 'runtime/hyperframes/**'
      - 'scripts/build_hyperframes_runtime_fixture.py'
      - 'scripts/verify_hyperframes_render.py'
      - 'tests/test_hyperframes_runtime_contract.py'
      - '.github/workflows/hyperframes-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify compiler/runtime contract tests
        run: python -m pytest -q tests/test_hyperframes_runtime_contract.py tests/test_phase05_render_stack.py
      - name: Build deterministic MOTION.OS HyperFrames fixture
        run: python scripts/build_hyperframes_runtime_fixture.py
      - name: Record pinned runtime versions
        run: |
          node --version
          ffmpeg -version | head -n 1
          npx --yes hyperframes@0.8.17 --version
      - name: HyperFrames lint
        working-directory: runtime/hyperframes
        run: npx --yes hyperframes@0.8.17 lint --json
      - name: HyperFrames render
        working-directory: runtime/hyperframes
        run: npx --yes hyperframes@0.8.17 render --output out/runtime-local.mp4 --fps 30 --quality standard --strict
      - name: Verify physical MP4 using frame-count authority
        run: python scripts/verify_hyperframes_render.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hyperframes-runtime-proof
          if-no-files-found: error
          path: |
            runtime/hyperframes/compiler_evidence.json
            runtime/hyperframes/render_evidence.local.json
            runtime/hyperframes/out/runtime-local.mp4
          retention-days: 14
