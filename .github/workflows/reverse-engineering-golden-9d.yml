name: Reverse Engineering Golden 9D
on:
  pull_request:
    paths:
      - 'src/reverse_engineering/qualification/**'
      - 'schemas/reverse_engineering_9d/**'
      - 'forensics/references/screenrecording_20260826/golden/aggregate_9d/**'
      - 'scripts/compile_golden_9d.py'
      - 'tests/test_reverse_engineering_9d_*.py'
      - 'docs/reverse_engineering_v2/QUALIFICATION_9D*.md'
      - '.github/workflows/reverse-engineering-golden-9d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Adversarial 9D contract tests
        run: python -m pytest -q tests/test_reverse_engineering_9d_contracts.py
      - name: Compile exact-head qualification graph
        run: |
          mkdir -p .artifacts/golden-9d
          python scripts/compile_golden_9d.py \
            --manifest forensics/references/screenrecording_20260826/golden/aggregate_9d/golden_evidence_manifest.json \
            --out .artifacts/golden-9d/current_qualification.json
      - name: Verify expected fail-closed frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.artifacts/golden-9d/current_qualification.json')
          d=json.loads(p.read_text())
          assert set(d['dimensions']) == {'temporal','motion','camera','typography','depth','color','fx','audio','retention'}
          assert d['dimensions']['temporal']['qualified'] is True
          assert d['full_9d_fidelity_validated'] is False
          assert d['canonical_template'] is False
          assert d['promotion_state'] == 'CROSS_SCENE_PARTIAL_QUALIFICATION'
          assert d['defect_frontier']
          assert d['diagnostic_coverage_ratio_is_promotion_authority'] is False
          print(json.dumps({
            'qualified_dimensions':[k for k,v in d['dimensions'].items() if v['qualified']],
            'defects_by_severity':d['defects_by_severity'],
            'coverage':d['diagnostic_coverage_ratio'],
            'promotion_state':d['promotion_state'],
          },indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reverse-engineering-golden-9d-proof
          if-no-files-found: error
          path: .artifacts/golden-9d/current_qualification.json
          retention-days: 14
