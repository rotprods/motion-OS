name: Golden 9D Camera Depth

on:
  pull_request:
    paths:
      - 'qualification/golden_9d/**'
      - 'schemas/golden_9d/**'
      - 'tests/test_golden_9d_*.py'
      - '.github/workflows/golden-9d-camera-depth.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-camera-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout T08 authority branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Contract and adversarial tests
        run: |
          python -m pytest -q \
            tests/test_golden_9d_matrix.py \
            tests/test_golden_9d_camera_depth.py
          python -m py_compile \
            qualification/golden_9d/compile_readiness.py \
            qualification/golden_9d/compile_camera_depth.py

      - name: Compile W2 camera depth qualification
        run: |
          mkdir -p .artifacts/golden_9d
          python qualification/golden_9d/compile_camera_depth.py \
            qualification/golden_9d/w2_camera_depth_evidence.json \
            --out .artifacts/golden_9d/w2_camera_depth_qualification.json

      - name: Verify W2 authority ceiling and closed micro-motion partition
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          q=json.loads(Path('.artifacts/golden_9d/w2_camera_depth_qualification.json').read_text())
          assert q['schema_version']=='motion-os.golden-w2-camera-depth-qualification/v1'
          assert q['authority']=='DERIVED_FAIL_CLOSED_W2_QUALIFICATION'
          assert q['w2_state']=='COMPLETE_WITH_EXPLICIT_CAUSAL_AND_DEPTH_UNKNOWNS'
          assert q['micro_motion']=={
              'candidate_count':220,
              'directional_corroborated':95,
              'activity_without_translation_authority':81,
              'not_corroborated':41,
              'source_lock_excluded':3,
          }
          assert q['cross_golden']['camera_reconstruct_exact']=='PARTIAL'
          assert q['cross_golden']['camera_structural_template']=='PARTIAL'
          assert q['cross_golden']['depth_reconstruct_exact']=='PARTIAL'
          assert q['cross_golden']['depth_structural_template']=='PARTIAL'
          assert q['cross_golden']['original_camera_or_ae_parenting']=='BLOCKED_OR_UNKNOWN'
          assert q['cross_golden']['source_lock_reflows']=='EXCLUDED_FROM_STRUCTURAL_CAMERA_GRAMMAR'
          assert all(row['depth']['acyclic'] for row in q['scene_results'].values())

          Path('.artifacts/golden_9d/w2_camera_depth_summary.json').write_text(json.dumps({
              'w2_state':q['w2_state'],
              'micro_motion':q['micro_motion'],
              'camera_structural':q['cross_golden']['camera_structural_template'],
              'depth_structural':q['cross_golden']['depth_structural_template'],
              'original_camera_or_ae_parenting':q['cross_golden']['original_camera_or_ae_parenting'],
              'scene_depth_edges':{k:v['depth']['edge_count'] for k,v in q['scene_results'].items()},
              'scene_unknown_depth_relations':{k:v['depth']['unknown_relation_count'] for k,v in q['scene_results'].items()},
          },indent=2)+'\n')
          PY

      - name: Upload W2 evidence projection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: golden-9d-camera-depth
          if-no-files-found: error
          path: |
            .artifacts/golden_9d/w2_camera_depth_qualification.json
            .artifacts/golden_9d/w2_camera_depth_summary.json
          retention-days: 14
