name: Python Frozen Product Gauntlet

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pyproject.toml'
      - 'pylock.py312-dev.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_ci_env.py'
      - '.github/workflows/python-frozen-product-gauntlet.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-frozen-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-e2e:
    name: Frozen Phase06 → Studio → Remotion → run manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install physical media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create frozen project venv
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/frozen-product-environment.json
      - name: Product run-manifest regression contract
        run: .venv-ci/quick312/bin/python -m pytest -q tests/test_product_e2e_run_manifest.py
      - name: Verify frozen Node runtime
        run: .venv-ci/quick312/bin/python scripts/verify_node_lock.py --json-out .artifacts/frozen-product-node.json
      - name: Execute physical Remotion path
        run: .venv-ci/quick312/bin/python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/frozen-product-remotion.json
      - name: Seal exact physical product run
        env:
          PRODUCT_ARTIFACT_REF: frozen-product://${{ github.repository }}/runs/${{ github.run_id }}/runtime-local.mp4
        run: |
          .venv-ci/quick312/bin/python scripts/studio_finalize_run.py \
            --bundle runtime/remotion/studio_execution_bundle.json \
            --runtime-evidence runtime/remotion/render_evidence.local.json \
            --runtime-spec runtime/remotion/src/runtimeSpec.json \
            --artifact runtime/remotion/out/runtime-local.mp4 \
            --artifact-ref "$PRODUCT_ARTIFACT_REF" \
            --git-sha "$(git rev-parse HEAD)" \
            --out .artifacts/frozen-product-run-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-product-e2e-evidence
          path: |
            .artifacts/frozen-product-environment.json
            .artifacts/frozen-product-node.json
            .artifacts/frozen-product-remotion.json
            .artifacts/frozen-product-run-manifest.json
            runtime/remotion/studio_execution_bundle.json
            runtime/remotion/render_evidence.local.json
            runtime/remotion/src/runtimeSpec.json
            runtime/remotion/out/runtime-local.mp4
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  offline-replay:
    name: Frozen evidence destruction → archive-only recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install physical media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Create frozen project venv
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/frozen-replay-environment.json
      - name: Offline replay regression contract
        run: .venv-ci/quick312/bin/python -m pytest -q tests/test_product_e2e_replay.py
      - name: Verify frozen Node runtime
        run: .venv-ci/quick312/bin/python scripts/verify_node_lock.py --json-out .artifacts/frozen-replay-node.json
      - name: Produce physical technical run
        run: .venv-ci/quick312/bin/python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/frozen-replay-remotion.json
      - name: Seal producer manifest
        env:
          PRODUCT_ARTIFACT_REF: frozen-replay://${{ github.repository }}/runs/${{ github.run_id }}/runtime-local.mp4
        run: |
          .venv-ci/quick312/bin/python scripts/studio_finalize_run.py \
            --bundle runtime/remotion/studio_execution_bundle.json \
            --runtime-evidence runtime/remotion/render_evidence.local.json \
            --runtime-spec runtime/remotion/src/runtimeSpec.json \
            --artifact runtime/remotion/out/runtime-local.mp4 \
            --artifact-ref "$PRODUCT_ARTIFACT_REF" \
            --git-sha "$(git rev-parse HEAD)" \
            --out .artifacts/product-run-manifest.json
      - name: Create only surviving product evidence package
        run: |
          .venv-ci/quick312/bin/python - <<'PY'
          from pathlib import Path
          import zipfile
          members = [
              '.artifacts/product-run-manifest.json',
              'runtime/remotion/studio_execution_bundle.json',
              'runtime/remotion/render_evidence.local.json',
              'runtime/remotion/src/runtimeSpec.json',
              'runtime/remotion/out/runtime-local.mp4',
          ]
          out = Path('.artifacts/frozen-offline-product-evidence.zip')
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for relative in members:
                  path = Path(relative)
                  if not path.is_file() or path.stat().st_size <= 0:
                      raise SystemExit(f'missing producer evidence: {relative}')
                  archive.write(path, relative)
          PY
      - name: Destroy producer workspace evidence
        run: |
          rm -f \
            .artifacts/product-run-manifest.json \
            runtime/remotion/studio_execution_bundle.json \
            runtime/remotion/render_evidence.local.json \
            runtime/remotion/src/runtimeSpec.json \
            runtime/remotion/out/runtime-local.mp4
          test -f .artifacts/frozen-offline-product-evidence.zip
          test ! -e .artifacts/product-run-manifest.json
          test ! -e runtime/remotion/studio_execution_bundle.json
          test ! -e runtime/remotion/render_evidence.local.json
          test ! -e runtime/remotion/src/runtimeSpec.json
          test ! -e runtime/remotion/out/runtime-local.mp4
      - name: Reconstruct and physically verify from archive only
        run: |
          .venv-ci/quick312/bin/python scripts/studio_replay_verify.py \
            --package .artifacts/frozen-offline-product-evidence.zip \
            --out .artifacts/frozen-offline-replay-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-offline-replay-evidence
          path: |
            .artifacts/frozen-replay-environment.json
            .artifacts/frozen-replay-node.json
            .artifacts/frozen-replay-remotion.json
            .artifacts/frozen-offline-product-evidence.zip
            .artifacts/frozen-offline-replay-report.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
