name: Semantic Alpha Runtime

on:
  pull_request:
    paths:
      - 'src/renderers/runtime_verifier.py'
      - 'scripts/verify_semantic_alpha_composite.py'
      - 'tests/test_phase08_alpha_runtime.py'
      - 'tests/test_semantic_alpha_composite.py'
      - '.github/workflows/semantic-alpha-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-alpha-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify alpha contracts
        run: python -m pytest -q tests/test_phase08_alpha_runtime.py tests/test_semantic_alpha_composite.py
      - name: Execute semantic alpha composite proof
        run: python scripts/verify_semantic_alpha_composite.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: semantic-alpha-runtime-proof
          if-no-files-found: error
          path: .artifacts/semantic-alpha/**
          retention-days: 14
