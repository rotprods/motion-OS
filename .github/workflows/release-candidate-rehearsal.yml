name: Release Candidate Rehearsal

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/release_candidate_rehearsal.py'
      - 'tests/test_release_candidate_rehearsal.py'
      - 'pyproject.toml'
      - 'pylock.py312-dev.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_ci_env.py'
      - '.github/workflows/release-candidate-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: read # required to read the live Issue #48 promotion barrier

concurrency:
  group: release-candidate-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  blocked-external-rehearsal:
    name: Prove live promotion preconditions remain blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Initialize fail-visible rehearsal receipt
        run: |
          mkdir -p .artifacts
          printf '%s\n' '{"schema":"motion-os.release-candidate-rehearsal/v1","status":"RUNNING","authority":"BLOCKED","promotion_authorized":false,"release_authorized":false,"project_done":false}' > .artifacts/release-candidate-rehearsal.json
      - name: Create frozen rehearsal environment
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/release-rehearsal-environment.json
      - name: Run rehearsal regression contract
        run: .venv-ci/quick312/bin/python -m pytest -q tests/test_release_candidate_rehearsal.py
      - name: Read live main and barrier twice and prove BLOCKED_EXTERNAL
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          .venv-ci/quick312/bin/python scripts/release_candidate_rehearsal.py \
            --repository "$REPOSITORY" \
            --candidate-sha "$CANDIDATE_SHA" \
            --expected-main-sha d4e628a1aef0cd382c3c2f1ea327a8ff70c41bd9 \
            --expect-status BLOCKED_EXTERNAL \
            --json-out .artifacts/release-candidate-rehearsal.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-candidate-rehearsal-evidence
          path: |
            .artifacts/release-rehearsal-environment.json
            .artifacts/release-candidate-rehearsal.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
