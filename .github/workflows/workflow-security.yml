name: Workflow Supply-Chain Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/**'
      - 'scripts/workflow_security_gate.py'
      - 'tests/test_workflow_security_gate.py'
      - 'ci/python_environments.json'
      - 'pylock.py312-dev.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repo-native fail-closed workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Create frozen policy environment
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/workflow-policy-environment.json
      - name: Run workflow policy regressions
        run: .venv-ci/quick312/bin/python -m pytest -q tests/test_workflow_security_gate.py
      - name: Audit every repository workflow
        run: .venv-ci/quick312/bin/python scripts/workflow_security_gate.py --json-out .artifacts/workflow-security.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workflow-security-policy-evidence
          path: |
            .artifacts/workflow-policy-environment.json
            .artifacts/workflow-security.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  zizmor:
    name: Independent zizmor static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run pinned zizmor 1.29.0
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2 -> zizmor 1.29.0
        with:
          advanced-security: false
          online-audits: false
