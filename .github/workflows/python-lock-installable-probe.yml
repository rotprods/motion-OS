name: Python Lock Installable Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pyproject.toml'
      - 'pylock.*.toml'
      - 'ci/python_toolchain.json'
      - 'scripts/python_lock_gate.py'
      - '.github/workflows/python-lock-installable-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-lock-installable-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ matrix.lock_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            extras: 'dev'
            requirement: ''
            lock_name: 'pylock.py311-dev.toml'
          - python: '3.12.14'
            extras: 'dev'
            requirement: ''
            lock_name: 'pylock.py312-dev.toml'
          - python: '3.12.14'
            extras: 'dev,analysis'
            requirement: ''
            lock_name: 'pylock.py312-analysis.toml'
          - python: '3.12.14'
            extras: 'dev'
            requirement: 'pip-audit==2.10.1'
            lock_name: 'pylock.py312-security.toml'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin probe generator
        run: python -m pip install --disable-pip-version-check 'pip==26.2.1'
      - name: Generate hash-complete third-party lock and prove installability
        env:
          LOCK_EXTRAS: ${{ matrix.extras }}
          LOCK_REQUIREMENT: ${{ matrix.requirement }}
          LOCK_NAME: ${{ matrix.lock_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          deps_lock="pylock._deps-${LOCK_NAME#pylock.}"
          build_lock="pylock._build-${LOCK_NAME#pylock.}"
          tool_lock="pylock._tool-${LOCK_NAME#pylock.}"
          candidate=".artifacts/${LOCK_NAME%.toml}-candidate.toml"

          python -m pip lock --only-deps -e ".[${LOCK_EXTRAS}]" -o "$deps_lock"
          python -m pip lock 'setuptools==84.0.0' -o "$build_lock"

          inputs=(-r "$deps_lock" -r "$build_lock")
          if [[ -n "$LOCK_REQUIREMENT" ]]; then
            python -m pip lock "$LOCK_REQUIREMENT" -o "$tool_lock"
            inputs+=(-r "$tool_lock")
          fi
          python -m pip lock "${inputs[@]}" -o "$candidate"

          python - "$candidate" "$LOCK_NAME" "${{ matrix.python }}" "$LOCK_REQUIREMENT" <<'PY'
          from pathlib import Path
          import hashlib, json, sys, tomllib
          candidate_name, logical_name, expected_python, requirement = sys.argv[1:]
          candidate = Path(candidate_name)
          raw = candidate.read_bytes()
          doc = tomllib.loads(raw.decode('utf-8'))
          packages = doc.get('packages')
          if doc.get('lock-version') != '1.0' or doc.get('created-by') != 'pip':
              raise SystemExit('invalid candidate header')
          if not isinstance(packages, list) or not packages:
              raise SystemExit('candidate packages missing')
          names = [str(p.get('name')) for p in packages]
          if 'motion-os' in names or any('directory' in p for p in packages):
              raise SystemExit('local project leaked into installable lock')
          versions = {str(p.get('name')): p.get('version') for p in packages}
          if versions.get('setuptools') != '84.0.0':
              raise SystemExit('setuptools build backend not locked')
          if requirement and versions.get('pip-audit') != '2.10.1':
              raise SystemExit('pip-audit root not locked')
          receipt = {
              'schema': 'motion-os.python-installable-lock-probe/v2',
              'status': 'GENERATED',
              'logical_lock_name': logical_name,
              'python': expected_python,
              'pip': '26.2.1',
              'setuptools_build': '84.0.0',
              'extra_requirement': requirement or None,
              'candidate_sha256': hashlib.sha256(raw).hexdigest(),
              'candidate_bytes': len(raw),
              'package_entries': len(packages),
              'package_versions': versions,
          }
          Path(f'.artifacts/{logical_name}.probe.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          python -m venv .artifacts/probe-env
          probe_py=.artifacts/probe-env/bin/python
          "$probe_py" -m pip install --disable-pip-version-check 'pip==26.2.1'
          "$probe_py" -m pip install --disable-pip-version-check -r "$candidate"
          "$probe_py" -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .
          "$probe_py" - <<'PY'
          import PIL, jsonschema, pytest, src
          print('PROBE_IMPORTS_OK')
          PY

          "$probe_py" - "$LOCK_NAME" <<'PY'
          from pathlib import Path
          import hashlib, importlib.metadata as m, json, sys
          logical_name = sys.argv[1]
          receipt_path = Path(f'.artifacts/{logical_name}.probe.json')
          receipt = json.loads(receipt_path.read_text())
          inventory = sorted(
              (d.metadata['Name'], d.version)
              for d in m.distributions()
              if d.metadata.get('Name')
          )
          inventory_bytes = json.dumps(inventory, separators=(',', ':'), sort_keys=False).encode()
          receipt.update(
              status='PASS',
              local_project_install='editable_no_deps_no_build_isolation',
              inventory_sha256=hashlib.sha256(inventory_bytes).hexdigest(),
              inventory=inventory,
          )
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps({k: receipt[k] for k in ('status','logical_lock_name','candidate_sha256','inventory_sha256')}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installable-${{ matrix.lock_name }}
          path: |
            .artifacts/${{ matrix.lock_name%.toml }}-candidate.toml
            .artifacts/${{ matrix.lock_name }}.probe.json
          if-no-files-found: error
          retention-days: 7
