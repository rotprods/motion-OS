name: Heterogeneous Tool Lock Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'runtime/heterogeneous-tools/package.json'
      - '.github/workflows/heterogeneous-tool-lock-bootstrap.yml'
  workflow_dispatch:

# TEMPORARY ONE-SHOT BOOTSTRAP. This workflow is intentionally noncompliant with
# steady-state write policy and MUST be deleted after the exact lock is persisted.
permissions:
  contents: write

concurrency:
  group: heterogeneous-tool-lock-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-persist-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PACKAGE_SHA256: f1027ead04e3a81312e3d91ac9099ef9a189178db8f6b77ffab33a2ac9099bb8
      EXPECTED_LOCK_SHA256: 7d82c7a07cab172f01948e4444af3b2e151d54d9a12f9ebdc177fdda0fa66334
      TARGET_BRANCH: feat/p8-6-workflow-supply-chain-hardening-20260909
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Generate and verify exact lock bytes
        working-directory: runtime/heterogeneous-tools
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          printf '%s  package.json\n' "$EXPECTED_PACKAGE_SHA256" | sha256sum --check --strict
          printf '%s  package-lock.json\n' "$EXPECTED_LOCK_SHA256" | sha256sum --check --strict
          sha256sum package.json package-lock.json > lock-sha256.txt
      - name: Persist exact lock through Git data CAS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, json, os, urllib.request, urllib.error

          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          expected = os.environ['EXPECTED_HEAD']
          token = os.environ['GITHUB_TOKEN']
          api = f'https://api.github.com/repos/{repo}'
          lock = Path('runtime/heterogeneous-tools/package-lock.json').read_bytes()

          def call(method, url, body=None):
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header('Authorization', f'Bearer {token}')
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.load(resp)

          ref = call('GET', f'{api}/git/ref/heads/{branch}')
          observed = ref['object']['sha']
          if observed != expected:
              raise SystemExit(f'STALE_CONTEXT: branch moved from {expected} to {observed}')

          commit = call('GET', f'{api}/git/commits/{expected}')
          blob = call('POST', f'{api}/git/blobs', {
              'content': base64.b64encode(lock).decode(),
              'encoding': 'base64',
          })
          tree = call('POST', f'{api}/git/trees', {
              'base_tree': commit['tree']['sha'],
              'tree': [{
                  'path': 'runtime/heterogeneous-tools/package-lock.json',
                  'mode': '100644',
                  'type': 'blob',
                  'sha': blob['sha'],
              }],
          })
          new_commit = call('POST', f'{api}/git/commits', {
              'message': 'chore(render): persist exact heterogeneous tool lock',
              'tree': tree['sha'],
              'parents': [expected],
          })
          # force=false means a concurrent sibling update cannot be overwritten.
          call('PATCH', f'{api}/git/refs/heads/{branch}', {'sha': new_commit['sha'], 'force': False})
          print(json.dumps({'status':'PERSISTED','parent':expected,'commit':new_commit['sha'],'blob':blob['sha']}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: heterogeneous-tool-lock-candidate
          path: |
            runtime/heterogeneous-tools/package.json
            runtime/heterogeneous-tools/package-lock.json
            runtime/heterogeneous-tools/lock-sha256.txt
          if-no-files-found: error
          retention-days: 7
