name: Heterogeneous Tool Lock Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'runtime/heterogeneous-tools/package.json'
      - '.github/workflows/heterogeneous-tool-lock-bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heterogeneous-tool-lock-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  lock-probe:
    name: Generate and prove installable heterogeneous tool lock
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Generate candidate lock from exact manifest
        working-directory: runtime/heterogeneous-tools
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          test -s package-lock.json
          sha256sum package.json package-lock.json > lock-sha256.txt
      - name: Prove candidate lock is accepted by npm ci
        working-directory: runtime/heterogeneous-tools
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --fund=false
          node - <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const hf=lock.packages['node_modules/hyperframes'];
          const lottie=lock.packages['node_modules/lottie-web'];
          const nested=lock.packages['node_modules/hyperframes/node_modules/puppeteer-core'];
          if(!hf || hf.version!=='0.8.17') throw new Error('hyperframes version mismatch');
          if(!lottie || lottie.version!=='5.13.0') throw new Error('lottie version mismatch');
          if(!nested) throw new Error('hyperframes puppeteer-core missing');
          console.log(JSON.stringify({hyperframes:hf.version,lottie:lottie.version,puppeteer_core:nested.version}));
          NODE
      - name: Audit candidate dependency graph
        working-directory: runtime/heterogeneous-tools
        run: npm audit --audit-level=high --omit=dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heterogeneous-tool-lock-candidate-v2
          path: |
            runtime/heterogeneous-tools/package.json
            runtime/heterogeneous-tools/package-lock.json
            runtime/heterogeneous-tools/lock-sha256.txt
          if-no-files-found: error
          retention-days: 7
