name: Heterogeneous Tool Lock Bootstrap

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'runtime/heterogeneous-tools/package.json'
      - '.github/workflows/heterogeneous-tool-lock-bootstrap.yml'
  workflow_dispatch:

# TEMPORARY one-shot bootstrap. MUST be deleted after the exact audited lock is persisted.
permissions:
  contents: write

concurrency:
  group: heterogeneous-tool-lock-bootstrap-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  persist-lock:
    name: Persist installable audited heterogeneous tool lock
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_PACKAGE_SHA256: b81982198d78cbca24d937c1acbf91d629c89f242b5d38952958f29a91a518fd
      EXPECTED_LOCK_SHA256: 3f7f0cb629b1edaa9dc043f2ebd36cc4e3933b7d65585105f0ef3d4716e6baa3
      TARGET_BRANCH: feat/p8-6-workflow-supply-chain-hardening-20260909
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Regenerate, verify, install and audit exact candidate
        working-directory: runtime/heterogeneous-tools
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          printf '%s  package.json\n' "$EXPECTED_PACKAGE_SHA256" | sha256sum --check --strict
          printf '%s  package-lock.json\n' "$EXPECTED_LOCK_SHA256" | sha256sum --check --strict
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --fund=false
          npm audit --audit-level=high --omit=dev
          node - <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const expected={hyperframes:'0.8.17','lottie-web':'5.13.0','puppeteer-core':'25.11.0'};
          for(const [name,version] of Object.entries(expected)){
            const entry=lock.packages[`node_modules/${name}`];
            if(!entry || entry.version!==version) throw new Error(`${name} lock mismatch`);
          }
          const pp=require('puppeteer-core');
          if(!pp?.launch) throw new Error('puppeteer-core unusable after npm ci');
          console.log(JSON.stringify(expected));
          NODE
      - name: Persist exact lock with branch-head CAS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; branch=os.environ['TARGET_BRANCH']; expected=os.environ['EXPECTED_HEAD']; token=os.environ['GITHUB_TOKEN']
          api=f'https://api.github.com/repos/{repo}'
          lock=Path('runtime/heterogeneous-tools/package-lock.json').read_bytes()
          def call(method,url,body=None):
              data=None if body is None else json.dumps(body,separators=(',',':')).encode()
              req=urllib.request.Request(url,data=data,method=method)
              req.add_header('Authorization',f'Bearer {token}'); req.add_header('Accept','application/vnd.github+json'); req.add_header('X-GitHub-Api-Version','2022-11-28')
              with urllib.request.urlopen(req,timeout=30) as resp: return json.load(resp)
          ref=call('GET',f'{api}/git/ref/heads/{branch}')
          if ref['object']['sha']!=expected: raise SystemExit(f'STALE_CONTEXT:{ref["object"]["sha"]}')
          commit=call('GET',f'{api}/git/commits/{expected}')
          blob=call('POST',f'{api}/git/blobs',{'content':base64.b64encode(lock).decode(),'encoding':'base64'})
          tree=call('POST',f'{api}/git/trees',{'base_tree':commit['tree']['sha'],'tree':[{'path':'runtime/heterogeneous-tools/package-lock.json','mode':'100644','type':'blob','sha':blob['sha']}]})
          new=call('POST',f'{api}/git/commits',{'message':'chore(render): persist installable audited heterogeneous tool lock v2','tree':tree['sha'],'parents':[expected]})
          call('PATCH',f'{api}/git/refs/heads/{branch}',{'sha':new['sha'],'force':False})
          print(json.dumps({'status':'PERSISTED','parent':expected,'commit':new['sha'],'blob':blob['sha']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heterogeneous-tool-lock-v2-persisted
          path: |
            runtime/heterogeneous-tools/package.json
            runtime/heterogeneous-tools/package-lock.json
          if-no-files-found: error
          retention-days: 7
