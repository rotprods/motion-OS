name: Python Lock Reproducibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pyproject.toml'
      - 'pylock.*.toml'
      - '.github/workflows/python-lock-bootstrap.yml'
      - 'scripts/python_lock_gate.py'
      - 'tests/test_python_lock_gate.py'
      - 'ci/python_toolchain.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-lock-repro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Regenerate ${{ matrix.lock_name }} exactly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            extras: 'dev'
            requirement: ''
            lock_name: 'pylock.py311-dev.toml'
          - python: '3.12.14'
            extras: 'dev'
            requirement: ''
            lock_name: 'pylock.py312-dev.toml'
          - python: '3.12.14'
            extras: 'dev,analysis'
            requirement: ''
            lock_name: 'pylock.py312-analysis.toml'
          - python: '3.12.14'
            extras: 'dev'
            requirement: 'pip-audit==2.10.1'
            lock_name: 'pylock.py312-security.toml'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin lock generator
        run: python -m pip install --disable-pip-version-check 'pip==26.2.1'
      - name: Regenerate and require byte-identical committed lock
        env:
          LOCK_EXTRAS: ${{ matrix.extras }}
          LOCK_REQUIREMENT: ${{ matrix.requirement }}
          LOCK_NAME: ${{ matrix.lock_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          test -s "$LOCK_NAME"
          cp "$LOCK_NAME" ".artifacts/${LOCK_NAME}.committed"
          extra_requirement=()
          if [[ -n "$LOCK_REQUIREMENT" ]]; then
            extra_requirement+=("$LOCK_REQUIREMENT")
          fi
          python -m pip lock -e ".[${LOCK_EXTRAS}]" "${extra_requirement[@]}" -o "$LOCK_NAME"
          cmp --silent ".artifacts/${LOCK_NAME}.committed" "$LOCK_NAME"
          python - "$LOCK_NAME" "${{ matrix.python }}" "$LOCK_REQUIREMENT" <<'PY'
          from pathlib import Path
          import hashlib, json, sys, tomllib
          name, expected_python, extra_requirement = sys.argv[1:]
          path = Path(name)
          raw = path.read_bytes()
          doc = tomllib.loads(raw.decode('utf-8'))
          packages = doc.get('packages')
          if doc.get('lock-version') != '1.0' or doc.get('created-by') != 'pip':
              raise SystemExit('unexpected lock header')
          if not isinstance(packages, list) or not packages:
              raise SystemExit('lock contains no packages')
          receipt = {
              'schema': 'motion-os.python-lock-regeneration/v1',
              'status': 'PASS',
              'committed_match': True,
              'lock_name': name,
              'python': expected_python,
              'pip': '26.2.1',
              'extra_requirement': extra_requirement or None,
              'pyproject_sha256': hashlib.sha256(Path('pyproject.toml').read_bytes()).hexdigest(),
              'lock_sha256': hashlib.sha256(raw).hexdigest(),
              'lock_bytes': len(raw),
              'package_entries': len(packages),
          }
          Path(f'.artifacts/{name}.regeneration.json').write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regen-${{ matrix.lock_name }}
          path: .artifacts/${{ matrix.lock_name }}.regeneration.json
          if-no-files-found: error
          retention-days: 7

  reproduce:
    name: Two clean installs ${{ matrix.lock_name }}
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            lock_name: 'pylock.py311-dev.toml'
          - python: '3.12.14'
            lock_name: 'pylock.py312-dev.toml'
          - python: '3.12.14'
            lock_name: 'pylock.py312-analysis.toml'
          - python: '3.12.14'
            lock_name: 'pylock.py312-security.toml'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin verifier pip
        run: python -m pip install --disable-pip-version-check 'pip==26.2.1'
      - name: Validate lock and reconstruct twice
        run: >-
          python scripts/python_lock_gate.py reproduce
          --lock "${{ matrix.lock_name }}"
          --json-out ".artifacts/${{ matrix.lock_name }}.reproducibility.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repro-${{ matrix.lock_name }}
          path: .artifacts/${{ matrix.lock_name }}.reproducibility.json
          if-no-files-found: error
          retention-days: 7
