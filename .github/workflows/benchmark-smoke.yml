name: Benchmark Smoke Physical

on:
  pull_request:
    paths:
      - 'src/benchmarks/**'
      - 'scripts/benchmark_smoke_batch.py'
      - 'tests/test_phase08_benchmark_*.py'
      - '.github/workflows/benchmark-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - working-directory: runtime/remotion
        run: npm install --no-audit --no-fund
      - name: Generate deterministic smoke manifest
        run: python scripts/benchmark_smoke_batch.py generate
      - name: Render five physical benchmark artifacts
        shell: bash
        run: |
          set -euo pipefail
          trap 'python scripts/benchmark_smoke_batch.py restore' EXIT
          for brief in \
            browser-launch-01 \
            browser-launch-02 \
            browser-launch-03 \
            browser-launch-04 \
            browser-launch-05; do
            python scripts/benchmark_smoke_batch.py render-one "$brief"
          done
      - name: Assert creative authority remains blocked
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('.artifacts/benchmark-smoke').glob('browser-launch-*.evidence.json'))
          assert len(files) == 5, files
          for path in files:
              data = json.loads(path.read_text())
              assert data['mechanical_pass'] is True
              assert data['creative_authority'] == 'BLOCKED'
              assert data['frame_count'] == 90
              assert data['fps'] == 30.0
              assert data['visual_duration_seconds'] == 3.0
          print('benchmark physical smoke: 5/5 mechanically verified; creative authority intentionally BLOCKED')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: benchmark-smoke-physical
          if-no-files-found: error
          path: .artifacts/benchmark-smoke/
          retention-days: 14
