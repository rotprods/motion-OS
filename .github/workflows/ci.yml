name: CI
on:
  pull_request:
  push:
    branches: [main, develop, bootstrap/canonical-reconcile]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -m compileall -q src scripts
      - run: python -m pytest -q
      - run: python scripts/repo_health.py

  analysis-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,analysis]'
      - name: Assert physical analysis capabilities
        run: |
          python - <<'PY'
          from src.extraction.providers import capability_registry
          caps=capability_registry()
          print(caps)
          assert caps['ffmpeg']['available'], caps
          assert caps['ffprobe']['available'], caps
          assert caps['opencv']['available'], caps
          PY
      - name: Execute real encoded-MP4 extraction E2E
        run: python -m pytest -q tests/test_real_signal_providers.py tests/test_real_video_e2e.py tests/test_style_signature_vector.py
      - run: python scripts/repo_health.py
