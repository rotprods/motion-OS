name: Python Environment Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pyproject.toml'
      - 'pylock.py311-dev.toml'
      - 'pylock.py312-dev.toml'
      - 'pylock.py312-analysis.toml'
      - 'pylock.py312-audit.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_environment.py'
      - 'tests/test_python_environment.py'
      - '.github/workflows/python-environment-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-environment-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Frozen ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: quick311
            python: '3.11.16'
          - environment: quick312
            python: '3.12.14'
          - environment: analysis
            python: '3.12.14'
          - environment: security
            python: '3.12.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Bootstrap exact pip only
        run: python -m pip install --disable-pip-version-check 'pip==26.2.1'
      - name: Validate environment contract before mutation
        run: python -S scripts/python_environment.py validate --environment '${{ matrix.environment }}' --json-out '.artifacts/${{ matrix.environment }}-preflight.json'
      - name: Install frozen environment and prove exact inventory
        run: python scripts/python_environment.py install --environment '${{ matrix.environment }}' --json-out '.artifacts/${{ matrix.environment }}-install.json'
      - name: Run environment contract regression tests
        run: python -m pytest -q tests/test_python_environment.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-environment-${{ matrix.environment }}
          path: .artifacts/${{ matrix.environment }}-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
