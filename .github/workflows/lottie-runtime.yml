name: Lottie Runtime

on:
  pull_request:
    paths:
      - 'src/compilers/lottie.py'
      - 'scripts/build_lottie_runtime_fixture.py'
      - 'scripts/verify_lottie_player.py'
      - 'tests/test_phase08_lottie_runtime.py'
      - '.github/workflows/lottie-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  player-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify compiler/player contracts
        run: python -m pytest -q tests/test_phase08_lottie_runtime.py
      - name: Build deterministic Lottie fixture
        run: python scripts/build_lottie_runtime_fixture.py
      - name: Install exact official lottie-web bundle without lifecycle scripts
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund lottie-web@5.13.0
          cp node_modules/lottie-web/build/player/lottie.min.js runtime/lottie/lottie.min.js
          npm view lottie-web@5.13.0 dist.integrity --json | tr -d '"' > runtime/lottie/npm_integrity.txt
          test -s runtime/lottie/lottie.min.js
          test -s runtime/lottie/npm_integrity.txt
      - name: Locate clean-runner Chrome
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Execute official lottie-web frame proof
        run: python scripts/verify_lottie_player.py --root runtime/lottie --chrome "$CHROME_BIN" --player-version 5.13.0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lottie-runtime-proof
          if-no-files-found: error
          path: |
            runtime/lottie/animation.json
            runtime/lottie/player_contract.json
            runtime/lottie/compiler_evidence.json
            runtime/lottie/npm_integrity.txt
            runtime/lottie/player_evidence.json
            runtime/lottie/screenshots/**
          retention-days: 14
