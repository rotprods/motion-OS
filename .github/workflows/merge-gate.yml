name: Merge Safe

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-safe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      analysis: ${{ steps.paths.outputs.analysis }}
      remotion: ${{ steps.paths.outputs.remotion }}
      security: ${{ steps.paths.outputs.security }}
      full: ${{ steps.paths.outputs.full }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          force=()
          if [[ "$GITHUB_EVENT_NAME" == "merge_group" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            force=(--force-full)
          fi
          python scripts/change_impact.py --git-base HEAD^1 "${force[@]}" --github-output "$GITHUB_OUTPUT"

  quick:
    name: Local contract / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Build frozen Python 3.12 environment
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/python-quick312-environment.json
      - name: Validate every workflow with pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d)"
          trap 'rm -rf "$tool_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --connect-timeout 10 --max-time 60 \
            'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' \
            -o "$tool_dir/actionlint.tar.gz"
          printf '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  %s\n' "$tool_dir/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          "$tool_dir/actionlint" -version
          "$tool_dir/actionlint"
      - name: Enforce fail-closed workflow supply-chain policy
        run: .venv-ci/quick312/bin/python scripts/workflow_security_gate.py --json-out .artifacts/workflow-security.json
      - name: Run the same local-first gate agents run before push
        run: .venv-ci/quick312/bin/python scripts/local_verify.py quick --json-out .artifacts/local-verify.json
      - name: Validate immutable agent event bus
        run: .venv-ci/quick312/bin/python scripts/agent_event.py validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: merge-safe-quick-evidence
          path: |
            .artifacts/python-quick312-environment.json
            .artifacts/workflow-security.json
            .artifacts/local-verify.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  compat311:
    name: Compatibility / Python 3.11
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
          cache: pip
      - name: Build frozen Python 3.11 environment
        run: python scripts/python_ci_env.py create --environment quick311 --json-out .artifacts/python-quick311-environment.json
      - run: .venv-ci/quick311/bin/python scripts/local_verify.py quick --json-out .artifacts/local-verify-311.json

  analysis:
    name: Physical analysis
    needs: classify
    if: needs.classify.outputs.analysis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install physical media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build frozen analysis environment
        run: python scripts/python_ci_env.py create --environment analysis --json-out .artifacts/python-analysis-environment.json
      - run: .venv-ci/analysis/bin/python scripts/local_verify.py analysis --json-out .artifacts/analysis-verify.json

  remotion:
    name: Physical Remotion runtime
    needs: classify
    if: needs.classify.outputs.remotion == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build frozen runtime Python environment
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/python-remotion-environment.json
      - name: Verify two clean frozen Node installs
        run: .venv-ci/quick312/bin/python scripts/verify_node_lock.py --json-out .artifacts/node-lock-verification.json
      - run: .venv-ci/quick312/bin/python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/remotion-verify.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: merge-safe-remotion-evidence
          path: |
            .artifacts/python-remotion-environment.json
            .artifacts/node-lock-verification.json
            .artifacts/remotion-verify.json
            runtime/remotion/out/runtime-local.mp4
            runtime/remotion/render_evidence.local.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  security:
    name: Dependency security
    needs: classify
    if: needs.classify.outputs.security == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Build frozen security environment
        run: python scripts/python_ci_env.py create --environment security --json-out .artifacts/python-security-environment.json
      - run: .venv-ci/security/bin/python scripts/local_verify.py security --skip-install-check --json-out .artifacts/security-verify.json
      - name: Audit exact Remotion npm lock for High/Critical advisories
        run: .venv-ci/security/bin/python scripts/npm_audit_gate.py --json-out .artifacts/npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: merge-safe-security-evidence
          path: |
            .artifacts/python-security-environment.json
            .artifacts/security-verify.json
            .artifacts/npm-audit.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  merge-safe:
    name: MERGE_SAFE
    if: always()
    needs: [classify, quick, compat311, analysis, remotion, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require every applicable gate to pass
        env:
          MERGE_SAFE_NEEDS_JSON: ${{ toJSON(needs) }}
          MERGE_SAFE_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          python3 scripts/merge_safe_gate.py | tee .artifacts/merge-safe-verdict.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: merge-safe-verdict
          path: .artifacts/merge-safe-verdict.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
