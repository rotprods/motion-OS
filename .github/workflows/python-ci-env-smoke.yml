name: Python CI Environment Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'pyproject.toml'
      - 'pylock.py311-dev.toml'
      - 'pylock.py312-dev.toml'
      - 'pylock.py312-analysis.toml'
      - 'pylock.py312-audit.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_ci_env.py'
      - 'tests/test_python_ci_env.py'
      - '.github/workflows/python-ci-env-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-env-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  environment:
    name: Fresh ${{ matrix.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: quick311
            python: '3.11.16'
          - environment: quick312
            python: '3.12.14'
          - environment: analysis
            python: '3.12.14'
          - environment: security
            python: '3.12.14'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Validate before creating the environment
        run: python -S scripts/python_ci_env.py validate --environment '${{ matrix.environment }}' --json-out '.artifacts/${{ matrix.environment }}-contract.json'
      - name: Build fresh venv from frozen lock contracts
        run: python scripts/python_ci_env.py create --environment '${{ matrix.environment }}' --json-out '.artifacts/${{ matrix.environment }}-environment.json'
      - name: Run environment regression tests from the frozen venv
        run: '.venv-ci/${{ matrix.environment }}/bin/python -m pytest -q tests/test_python_ci_env.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frozen-${{ matrix.environment }}
          path: .artifacts/${{ matrix.environment }}-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
