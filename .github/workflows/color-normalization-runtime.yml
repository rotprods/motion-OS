name: Color Normalization Runtime

on:
  pull_request:
    paths:
      - 'src/renderers/color_policy.py'
      - 'scripts/verify_color_normalization.py'
      - 'tests/test_phase08_color_policy.py'
      - '.github/workflows/color-normalization-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  color-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -filters | grep -q zscale
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Verify color policy contracts
        run: python -m pytest -q tests/test_phase08_color_policy.py
      - name: Execute heterogeneous color normalization proof
        run: python scripts/verify_color_normalization.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: color-normalization-runtime-proof
          if-no-files-found: error
          path: .artifacts/color-normalization/**
          retention-days: 14
