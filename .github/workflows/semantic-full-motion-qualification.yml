name: Semantic Full Motion Qualification

on:
  pull_request:
    paths:
      - "src/semantic_index/**"
      - "tests/test_semantic*.py"
      - "benchmarks/semantic_retrieval_v1.json"
      - ".semantic-index.json"
      - "compose.semantic.yml"
      - "scripts/bootstrap_semantic_plane.sh"
      - ".github/workflows/semantic-full-motion-qualification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-full-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Full MOTION corpus
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_EMBED_MODEL: bge-m3
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: motion_semantic_full_ci_v1
      SEMANTIC_BATCH_SIZE: "16"
      COS_ROUTE_MULTIPLIER: "32"

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Start pinned Ollama and Qdrant
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name semantic-full-ollama \
            -p 127.0.0.1:11434:11434 \
            ollama/ollama:0.33.2
          docker run -d --rm \
            --name semantic-full-qdrant \
            -p 127.0.0.1:6333:6333 \
            qdrant/qdrant:v1.19.0

          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null

          for _ in $(seq 1 90); do
            curl -fsS --max-time 2 http://127.0.0.1:6333/collections >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:6333/collections >/dev/null

      - name: Pull BGE-M3
        run: |
          set -euo pipefail
          docker exec semantic-full-ollama ollama pull bge-m3
          docker exec semantic-full-ollama ollama list

      - name: Prepare evidence and Motion-only labeled benchmark
        run: |
          set -euo pipefail
          mkdir -p semantic-full-motion-artifacts
          git rev-parse HEAD | tee semantic-full-motion-artifacts/source-sha.txt
          python - <<'PY'
          import fnmatch
          import json
          from pathlib import Path

          root = Path('.').resolve()
          dataset = json.loads(Path('benchmarks/semantic_retrieval_v1.json').read_text(encoding='utf-8'))
          motion_cases = [
              case for case in dataset['cases']
              if case['expected'] and all(target['repo'] == 'rotprods/motion-OS' for target in case['expected'])
          ]
          files = [p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.relative_to(root).parts]
          missing = []
          for case in motion_cases:
              for target in case['expected']:
                  pattern = target['path_glob']
                  if not any(fnmatch.fnmatch(path, pattern) for path in files):
                      missing.append({'case': case['id'], 'path_glob': pattern})
          subset = {
              'name': 'MOTION.OS semantic retrieval v1 — full-corpus qualification subset',
              'k': dataset['k'],
              'chunk_oversample': dataset.get('chunk_oversample', 8),
              'repo_ids': ['rotprods/motion-OS'],
              'gates': dataset['gates'],
              'cases': motion_cases,
          }
          Path('/tmp/motion-semantic-retrieval.json').write_text(json.dumps(subset, indent=2), encoding='utf-8')
          preflight = {
              'case_count': len(motion_cases),
              'missing': missing,
              'passed': len(motion_cases) >= 10 and not missing,
          }
          Path('semantic-full-motion-artifacts/preflight.json').write_text(json.dumps(preflight, indent=2), encoding='utf-8')
          print(json.dumps(preflight, indent=2))
          if not preflight['passed']:
              raise SystemExit('Motion benchmark preflight failed')
          PY

      - name: Doctor live services
        run: |
          set -euo pipefail
          python -m src.semantic_index doctor | tee semantic-full-motion-artifacts/doctor.json

      - name: Index complete MOTION repository
        run: |
          set -euo pipefail
          python -m src.semantic_index index --repo . | tee semantic-full-motion-artifacts/index.json

      - name: Count indexed MOTION points
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          base = os.environ['QDRANT_URL'].rstrip('/')
          collection = os.environ['QDRANT_COLLECTION']
          payload = json.dumps({
              'filter': {'must': [{'key': 'repo', 'match': {'value': 'rotprods/motion-OS'}}]},
              'exact': True,
          }).encode()
          req = urllib.request.Request(
              f'{base}/collections/{collection}/points/count',
              data=payload,
              headers={'content-type': 'application/json'},
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=60) as response:
              body = json.loads(response.read().decode())
          report = {'rotprods/motion-OS': int(body['result']['count'])}
          Path('semantic-full-motion-artifacts/counts.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report, indent=2))
          PY

      - name: Graphify entire MOTION corpus
        run: |
          set -euo pipefail
          python -m src.semantic_index graphify \
            --repo-id rotprods/motion-OS \
            --neighbors 8 \
            --min-score 0.15 \
            | tee semantic-full-motion-artifacts/graphify.json

      - name: Evaluate full-corpus Motion retrieval
        run: |
          set +e
          python -m src.semantic_index evaluate \
            --dataset /tmp/motion-semantic-retrieval.json \
            > semantic-full-motion-artifacts/evaluation.json
          CODE=$?
          set -e
          echo "$CODE" > semantic-full-motion-artifacts/evaluation.exitcode
          cat semantic-full-motion-artifacts/evaluation.json
          echo "evaluation exit code: $CODE"

      - name: Benchmark live full MOTION collection
        run: |
          set -euo pipefail
          python -m src.semantic_index benchmark --live --iterations 8 \
            | tee semantic-full-motion-artifacts/benchmark.json

      - name: Create portable full-MOTION Qdrant snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          root = Path('semantic-full-motion-artifacts')
          base = os.environ['QDRANT_URL'].rstrip('/')
          collection = os.environ['QDRANT_COLLECTION']
          req = urllib.request.Request(
              f'{base}/collections/{collection}/snapshots?wait=true',
              data=b'', headers={'content-type': 'application/json'}, method='POST'
          )
          with urllib.request.urlopen(req, timeout=600) as response:
              created = json.loads(response.read().decode())
          result = created.get('result') or {}
          name = result.get('name')
          if not name:
              raise SystemExit(f'snapshot creation failed: {created}')
          with urllib.request.urlopen(f'{base}/collections/{collection}/snapshots/{name}', timeout=600) as response:
              data = response.read()
          path = root / name
          path.write_bytes(data)
          meta = {
              'collection': collection,
              'snapshot': result,
              'downloaded_bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
          }
          (root / 'snapshot.json').write_text(json.dumps(meta, indent=2), encoding='utf-8')
          print(json.dumps(meta, indent=2))
          PY

      - name: Assert full MOTION qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('semantic-full-motion-artifacts')
          load = lambda name: json.loads((root / name).read_text(encoding='utf-8'))
          preflight = load('preflight.json')
          doctor = load('doctor.json')
          index = load('index.json')
          counts = load('counts.json')
          graphify = load('graphify.json')
          evaluation = load('evaluation.json')
          benchmark = load('benchmark.json')
          snapshot = load('snapshot.json')
          eval_code = int((root / 'evaluation.exitcode').read_text().strip())

          assert preflight['passed'] is True and preflight['case_count'] >= 10, preflight
          assert doctor['ok'] is True and doctor['ollama']['probe_dims'] == 1024, doctor
          assert len(index['reports']) == 1, index
          report = index['reports'][0]
          assert report['repo'] == 'rotprods/motion-OS' and report['chunks'] > 0 and report['upserted'] > 0, report
          assert counts['rotprods/motion-OS'] == report['upserted'], (counts, report)
          assert graphify['graphify_version'] == 'graphify-v4-qdrant-prefetch-rerank', graphify
          assert graphify['vector_payload_transfer'] == 'none', graphify
          assert graphify['nodes_updated'] == counts['rotprods/motion-OS'], (graphify, counts)
          assert graphify['edges'] > 0, graphify
          assert eval_code == 0 and evaluation['passed'] is True, evaluation
          assert evaluation['case_count'] >= 10, evaluation
          assert benchmark['passed'] is True and benchmark['live']['passed'] is True, benchmark
          assert snapshot['downloaded_bytes'] > 0, snapshot
          snap = root / snapshot['snapshot']['name']
          assert snap.is_file() and snap.stat().st_size == snapshot['downloaded_bytes']
          print('FULL_MOTION_SEMANTIC_QUALIFICATION=PASS')
          PY

      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p semantic-full-motion-artifacts
          docker logs semantic-full-ollama > semantic-full-motion-artifacts/ollama.log 2>&1 || true
          docker logs semantic-full-qdrant > semantic-full-motion-artifacts/qdrant.log 2>&1 || true
          docker ps -a > semantic-full-motion-artifacts/docker-ps.txt || true

      - name: Upload full MOTION evidence and snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-full-motion-${{ github.sha }}
          path: semantic-full-motion-artifacts/
          if-no-files-found: error
          retention-days: 14
