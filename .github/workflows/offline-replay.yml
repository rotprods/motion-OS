name: Offline Replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/studio/replay.py'
      - 'src/studio/run_manifest.py'
      - 'src/studio/content_bridge.py'
      - 'scripts/studio_replay_verify.py'
      - 'scripts/studio_finalize_run.py'
      - 'scripts/build_remotion_runtime_fixture.py'
      - 'scripts/verify_remotion_render.py'
      - 'runtime/remotion/**'
      - 'tests/test_product_e2e_replay.py'
      - '.github/workflows/offline-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  archive-only-replay:
    name: Destroy workspace evidence → restore ZIP → verify physical replay
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install physical media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run offline replay regression contract
        run: python -m pytest -q tests/test_product_e2e_replay.py
      - name: Verify frozen Node runtime twice
        run: python scripts/verify_node_lock.py --json-out .artifacts/offline-replay-node-lock.json
      - name: Produce one authorized physical technical run
        run: python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/offline-replay-remotion-verify.json
      - name: Seal producer product-run manifest
        shell: bash
        env:
          PRODUCT_ARTIFACT_REF: offline-replay://${{ github.repository }}/runs/${{ github.run_id }}/runtime-local.mp4
        run: |
          set -euo pipefail
          python scripts/studio_finalize_run.py \
            --bundle runtime/remotion/studio_execution_bundle.json \
            --runtime-evidence runtime/remotion/render_evidence.local.json \
            --runtime-spec runtime/remotion/src/runtimeSpec.json \
            --artifact runtime/remotion/out/runtime-local.mp4 \
            --artifact-ref "$PRODUCT_ARTIFACT_REF" \
            --git-sha "$(git rev-parse HEAD)" \
            --out .artifacts/product-run-manifest.json
      - name: Create the only surviving product evidence package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path.cwd()
          members = [
              '.artifacts/product-run-manifest.json',
              'runtime/remotion/studio_execution_bundle.json',
              'runtime/remotion/render_evidence.local.json',
              'runtime/remotion/src/runtimeSpec.json',
              'runtime/remotion/out/runtime-local.mp4',
          ]
          out = root / '.artifacts/offline-product-evidence.zip'
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED) as archive:
              for relative in members:
                  path = root / relative
                  if not path.is_file() or path.stat().st_size <= 0:
                      raise SystemExit(f'missing producer evidence: {relative}')
                  archive.write(path, relative)
          print(out)
          PY
      - name: Destroy producer evidence outside the ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .artifacts/product-run-manifest.json \
            runtime/remotion/studio_execution_bundle.json \
            runtime/remotion/render_evidence.local.json \
            runtime/remotion/src/runtimeSpec.json \
            runtime/remotion/out/runtime-local.mp4
          test -f .artifacts/offline-product-evidence.zip
          test ! -e .artifacts/product-run-manifest.json
          test ! -e runtime/remotion/studio_execution_bundle.json
          test ! -e runtime/remotion/render_evidence.local.json
          test ! -e runtime/remotion/src/runtimeSpec.json
          test ! -e runtime/remotion/out/runtime-local.mp4
      - name: Reconstruct and physically verify from archive only
        run: |
          python scripts/studio_replay_verify.py \
            --package .artifacts/offline-product-evidence.zip \
            --out .artifacts/offline-replay-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-replay-evidence
          path: |
            .artifacts/offline-replay-node-lock.json
            .artifacts/offline-replay-remotion-verify.json
            .artifacts/offline-product-evidence.zip
            .artifacts/offline-replay-report.json
          if-no-files-found: warn
          retention-days: 14
