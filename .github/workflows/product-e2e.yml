name: Product E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/studio/**'
      - 'src/content/**'
      - 'src/graph/**'
      - 'src/renderers/**'
      - 'src/compilers/**'
      - 'scripts/studio_*.py'
      - 'scripts/build_remotion_runtime_fixture.py'
      - 'scripts/verify_remotion_render.py'
      - 'runtime/remotion/**'
      - 'tests/test_product_e2e_run_manifest.py'
      - '.github/workflows/product-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  technical-product-e2e:
    name: Phase06 → Studio → physical Remotion → recovery
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install physical media runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Run product run-manifest regression contract
        run: python -m pytest -q tests/test_product_e2e_run_manifest.py
      - name: Verify frozen Node runtime twice
        run: python scripts/verify_node_lock.py --json-out .artifacts/product-e2e-node-lock.json
      - name: Execute authorized physical Remotion path
        run: python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/product-e2e-remotion-verify.json
      - name: Seal exact physical product run
        shell: bash
        env:
          PRODUCT_ARTIFACT_REF: github-actions://${{ github.repository }}/runs/${{ github.run_id }}/product-e2e-evidence/runtime-local.mp4
        run: |
          set -euo pipefail
          python scripts/studio_finalize_run.py \
            --bundle runtime/remotion/studio_execution_bundle.json \
            --runtime-evidence runtime/remotion/render_evidence.local.json \
            --runtime-spec runtime/remotion/src/runtimeSpec.json \
            --artifact runtime/remotion/out/runtime-local.mp4 \
            --artifact-ref "$PRODUCT_ARTIFACT_REF" \
            --git-sha "$(git rev-parse HEAD)" \
            --out .artifacts/product-run-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: product-e2e-evidence
          path: |
            .artifacts/product-e2e-node-lock.json
            .artifacts/product-e2e-remotion-verify.json
            .artifacts/product-run-manifest.json
            runtime/remotion/compiler_evidence.json
            runtime/remotion/studio_execution_bundle.json
            runtime/remotion/src/runtimeSpec.json
            runtime/remotion/render_evidence.local.json
            runtime/remotion/out/runtime-local.mp4
          if-no-files-found: warn
          retention-days: 14
