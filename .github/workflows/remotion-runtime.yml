name: Remotion Runtime (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - working-directory: runtime/remotion
        run: npm install --no-audit --no-fund
      - run: python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/remotion-manual.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remotion-runtime-proof
          if-no-files-found: warn
          path: |
            .artifacts/remotion-manual.json
            runtime/remotion/out/runtime-local.mp4
            runtime/remotion/render_evidence.local.json
          retention-days: 14
