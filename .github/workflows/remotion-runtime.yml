name: Remotion Runtime (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: remotion-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render-proof:
    name: Physical Remotion runtime proof
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: runtime/remotion/package-lock.json
      - name: Install FFmpeg runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build frozen runtime Python environment
        run: python scripts/python_ci_env.py create --environment quick312 --json-out .artifacts/remotion-manual-environment.json
      - name: Verify two clean frozen Node installs
        run: .venv-ci/quick312/bin/python scripts/verify_node_lock.py --json-out .artifacts/node-lock-verification.json
      - name: Execute physical Remotion verification
        run: .venv-ci/quick312/bin/python scripts/local_verify.py remotion --skip-install-check --json-out .artifacts/remotion-manual.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: remotion-runtime-proof
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .artifacts/remotion-manual-environment.json
            .artifacts/node-lock-verification.json
            .artifacts/remotion-manual.json
            runtime/remotion/out/runtime-local.mp4
            runtime/remotion/render_evidence.local.json
          retention-days: 14
