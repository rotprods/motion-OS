name: Coordination Contracts
on:
  pull_request:
    paths:
      - 'src/coordination/**'
      - 'tests/test_coordination_*.py'
      - 'schemas/coordination_*.schema.json'
      - 'schemas/context_pack.schema.json'
      - 'schemas/resource_lease.schema.json'
      - 'scripts/coordination_cli.py'
      - 'coordination/**'
      - '.github/workflows/coordination-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/coordination/**'
      - 'tests/test_coordination_*.py'
      - 'scripts/coordination_cli.py'
      - 'coordination/**'
permissions:
  contents: read
jobs:
  coordination-contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Compile coordination surfaces
        run: python -m compileall -q src/coordination scripts/coordination_cli.py
      - name: Run coordination contract suite
        run: python -m pytest -q tests/test_coordination_*.py
      - name: Repository health
        run: python scripts/repo_health.py
