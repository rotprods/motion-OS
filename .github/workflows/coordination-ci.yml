name: Coordination Contracts
on:
  pull_request:
    paths:
      - 'src/coordination/**'
      - 'tests/test_coordination_*.py'
      - 'schemas/coordination_*.schema.json'
      - 'schemas/context_pack.schema.json'
      - 'schemas/resource_lease.schema.json'
      - 'scripts/coordination_cli.py'
      - 'coordination/**'
      - 'pyproject.toml'
      - 'pylock.py311-dev.toml'
      - 'pylock.py312-dev.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_ci_env.py'
      - '.github/workflows/coordination-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/coordination/**'
      - 'tests/test_coordination_*.py'
      - 'scripts/coordination_cli.py'
      - 'coordination/**'
      - 'schemas/coordination_*.schema.json'
      - 'schemas/context_pack.schema.json'
      - 'schemas/resource_lease.schema.json'
      - 'pyproject.toml'
      - 'pylock.py311-dev.toml'
      - 'pylock.py312-dev.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_ci_env.py'
      - '.github/workflows/coordination-ci.yml'
permissions:
  contents: read
jobs:
  coordination-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            environment: quick311
          - python: '3.12.14'
            environment: quick312
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Create frozen coordination environment
        run: python scripts/python_ci_env.py create --environment '${{ matrix.environment }}' --json-out '.artifacts/coordination-${{ matrix.environment }}-environment.json'
      - name: Compile coordination surfaces
        run: '.venv-ci/${{ matrix.environment }}/bin/python -m compileall -q src/coordination scripts/coordination_cli.py'
      - name: Run coordination contract suite
        run: '.venv-ci/${{ matrix.environment }}/bin/python -m pytest -q tests/test_coordination_*.py'
      - name: Repository health
        run: '.venv-ci/${{ matrix.environment }}/bin/python scripts/repo_health.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coordination-${{ matrix.environment }}-environment
          path: .artifacts/coordination-${{ matrix.environment }}-environment.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
