name: Python Lock Candidate Generation

on:
  workflow_dispatch:

permissions:
  contents: read

# CI MUST NOT write commits back to an active PR branch. A prior version of this
# workflow used GITHUB_TOKEN + Contents API PUTs on feat/python-ci-locks-20260909.
# Those bot-authored synchronize events left subsequent PR workflows in
# action_required with zero jobs. This workflow now only generates and uploads
# exact lock candidates. Promotion is a separate explicit commit after review.

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
      - name: Generate exact Python 3.11 project lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip lock --only-deps -e '.[dev]' -o pylock._deps-py311-dev.toml
          python -m pip lock 'setuptools==84.0.0' -o pylock._build-py311-dev.toml
          python -m pip lock -r pylock._deps-py311-dev.toml -r pylock._build-py311-dev.toml -o pylock.py311-dev.toml
          printf '%s  %s\n' '4ebe8e5a5beb027d02824a67c3d00b8c4c0bef9c08e0cb14b96ed9182543aebe' pylock.py311-dev.toml | sha256sum --check --strict
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Generate exact Python 3.12 project and audit locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip lock --only-deps -e '.[dev]' -o pylock._deps-py312-dev.toml
          python -m pip lock 'setuptools==84.0.0' -o pylock._build-py312-dev.toml
          python -m pip lock -r pylock._deps-py312-dev.toml -r pylock._build-py312-dev.toml -o pylock.py312-dev.toml

          python -m pip lock --only-deps -e '.[dev,analysis]' -o pylock._deps-py312-analysis.toml
          python -m pip lock 'setuptools==84.0.0' -o pylock._build-py312-analysis.toml
          python -m pip lock -r pylock._deps-py312-analysis.toml -r pylock._build-py312-analysis.toml -o pylock.py312-analysis.toml

          python -m pip lock 'pip-audit==2.10.1' -o pylock.py312-audit.toml

          printf '%s  %s\n' 'af5afbc2ee43f8719e0343a26e7ca0062d32a7a0f459c55c9e51d68d515c8f41' pylock.py312-dev.toml | sha256sum --check --strict
          printf '%s  %s\n' 'c532a7e0d48fd2e43cda6a459685fd8aeb3f61da24e45f8eced46c7187c31388' pylock.py312-analysis.toml | sha256sum --check --strict
          printf '%s  %s\n' '6c111783b033ebd8a6e859ce732d8fc35293905a2bb6ee8b62111515bfae1747' pylock.py312-audit.toml | sha256sum --check --strict
      - name: Write candidate manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          sha256sum \
            pylock.py311-dev.toml \
            pylock.py312-dev.toml \
            pylock.py312-analysis.toml \
            pylock.py312-audit.toml \
            > .artifacts/python-lock-candidates.sha256
          git diff --exit-code -- . ':!pylock*.toml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-lock-candidates
          path: |
            pylock.py311-dev.toml
            pylock.py312-dev.toml
            pylock.py312-analysis.toml
            pylock.py312-audit.toml
            .artifacts/python-lock-candidates.sha256
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
