name: Python Lock One-Shot Promotion

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/python-lock-promote.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    if: github.repository == 'rotprods/motion-OS' && (github.head_ref == 'feat/python-ci-locks-20260909' || github.ref_name == 'feat/python-ci-locks-20260909')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: feat/python-ci-locks-20260909
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.16'
      - name: Generate exact Python 3.11 project lock
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip lock --only-deps -e '.[dev]' -o pylock._deps-py311-dev.toml
          python -m pip lock 'setuptools==84.0.0' -o pylock._build-py311-dev.toml
          python -m pip lock -r pylock._deps-py311-dev.toml -r pylock._build-py311-dev.toml -o pylock.py311-dev.toml
          printf '%s  %s\n' '4ebe8e5a5beb027d02824a67c3d00b8c4c0bef9c08e0cb14b96ed9182543aebe' pylock.py311-dev.toml | sha256sum --check --strict
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Generate exact Python 3.12 project and audit locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pip==26.2.1'
          python -m pip lock --only-deps -e '.[dev]' -o pylock._deps-py312-dev.toml
          python -m pip lock 'setuptools==84.0.0' -o pylock._build-py312-dev.toml
          python -m pip lock -r pylock._deps-py312-dev.toml -r pylock._build-py312-dev.toml -o pylock.py312-dev.toml

          python -m pip lock --only-deps -e '.[dev,analysis]' -o pylock._deps-py312-analysis.toml
          python -m pip lock 'setuptools==84.0.0' -o pylock._build-py312-analysis.toml
          python -m pip lock -r pylock._deps-py312-analysis.toml -r pylock._build-py312-analysis.toml -o pylock.py312-analysis.toml

          python -m pip lock 'pip-audit==2.10.1' -o pylock.py312-audit.toml

          printf '%s  %s\n' 'af5afbc2ee43f8719e0343a26e7ca0062d32a7a0f459c55c9e51d68d515c8f41' pylock.py312-dev.toml | sha256sum --check --strict
          printf '%s  %s\n' 'c532a7e0d48fd2e43cda6a459685fd8aeb3f61da24e45f8eced46c7187c31388' pylock.py312-analysis.toml | sha256sum --check --strict
          printf '%s  %s\n' '6c111783b033ebd8a6e859ce732d8fc35293905a2bb6ee8b62111515bfae1747' pylock.py312-audit.toml | sha256sum --check --strict
      - name: Promote exact generated bytes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          put_file() {
            local path="$1"
            local current_sha
            current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${TARGET_BRANCH}" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="build(python): promote exact generated ${path}" -f branch="$TARGET_BRANCH" -f content="$(base64 -w0 "$path")")
            if [[ -n "$current_sha" ]]; then args+=(-f sha="$current_sha"); fi
            gh api "${args[@]}" >/dev/null
          }
          put_file pylock.py311-dev.toml
          put_file pylock.py312-dev.toml
          put_file pylock.py312-analysis.toml
          put_file pylock.py312-audit.toml

          old_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pylock.py312-security.toml?ref=${TARGET_BRANCH}" --jq .sha 2>/dev/null || true)"
          if [[ -n "$old_sha" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/pylock.py312-security.toml" \
              -f message='build(python): retire non-installable monolithic security lock' \
              -f branch="$TARGET_BRANCH" -f sha="$old_sha" >/dev/null
          fi
