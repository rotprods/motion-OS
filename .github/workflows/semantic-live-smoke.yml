name: Semantic Live Smoke

on:
  pull_request:
    paths:
      - "src/semantic_index/**"
      - "tests/test_semantic*.py"
      - ".semantic-index.json"
      - "compose.semantic.yml"
      - "scripts/bootstrap_semantic_plane.sh"
      - ".github/workflows/semantic-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-live-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physical-semantic-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_EMBED_MODEL: bge-m3
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: semantic_ci_smoke_v1
      SEMANTIC_BATCH_SIZE: "4"
      COS_ROUTE_MULTIPLIER: "32"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Start pinned Ollama and Qdrant
        run: |
          set -euo pipefail
          docker run -d --rm \
            --name semantic-ollama \
            -p 127.0.0.1:11434:11434 \
            ollama/ollama:0.33.2
          docker run -d --rm \
            --name semantic-qdrant \
            -p 127.0.0.1:6333:6333 \
            qdrant/qdrant:v1.19.0

          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:11434/api/tags >/dev/null

          for _ in $(seq 1 90); do
            if curl -fsS --max-time 2 http://127.0.0.1:6333/collections >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS --max-time 5 http://127.0.0.1:6333/collections >/dev/null

      - name: Pull BGE-M3 locally
        run: |
          set -euo pipefail
          docker exec semantic-ollama ollama pull bge-m3
          docker exec semantic-ollama ollama list

      - name: Build deterministic physical fixture
        run: |
          set -euo pipefail
          rm -rf /tmp/semantic-fixture
          mkdir -p /tmp/semantic-fixture/src
          cat > /tmp/semantic-fixture/.semantic-index.json <<'JSON'
          {
            "schema_version": 1,
            "repo_id": "ci/semantic-fixture",
            "include": ["*", "**/*"],
            "exclude": [],
            "max_file_bytes": 1572864,
            "store_text": true,
            "chunk": {"target_chars": 280, "max_chars": 420, "overlap_chars": 40}
          }
          JSON
          cat > /tmp/semantic-fixture/src/render_pipeline.py <<'PY'
          def build_render_plan(reference_frames, visual_dna):
              """Combine reference retrieval evidence with visual DNA before rendering."""
              return {"frames": reference_frames, "visual_dna": visual_dna, "stage": "render"}

          def critique_render(render, semantic_targets):
              """Compare the rendered output against semantic and visual targets."""
              return {"render": render, "targets": semantic_targets, "stage": "critic"}
          PY
          cat > /tmp/semantic-fixture/src/retrieval.py <<'PY'
          def retrieve_references(query, corpus):
              """Retrieve semantically related references with provenance."""
              return [item for item in corpus if query.lower() in item.lower()]

          def synthesize_visual_dna(references):
              """Extract style, composition, motion and typography signals from references."""
              return {"reference_count": len(references), "kind": "visual_dna"}
          PY
          cat > /tmp/semantic-fixture/src/agent_graph.md <<'MD'
          # Agent Graph

          Retrieval agents collect evidence. A Visual DNA agent converts evidence into style constraints.
          Render agents execute those constraints, and critic agents score the rendered result before another iteration.
          MD
          git -C /tmp/semantic-fixture init -q
          git -C /tmp/semantic-fixture config user.email semantic-ci@example.invalid
          git -C /tmp/semantic-fixture config user.name semantic-ci
          git -C /tmp/semantic-fixture add .
          git -C /tmp/semantic-fixture commit -qm "semantic fixture"

      - name: Doctor, index, graphify and query real services
        run: |
          set -euo pipefail
          mkdir -p semantic-smoke-artifacts
          python -m src.semantic_index doctor | tee semantic-smoke-artifacts/doctor.json
          python -m src.semantic_index index --repo /tmp/semantic-fixture | tee semantic-smoke-artifacts/index.json
          python -m src.semantic_index graphify --repo-id ci/semantic-fixture --neighbors 3 | tee semantic-smoke-artifacts/graphify.json
          python -m src.semantic_index query --repo-id ci/semantic-fixture --limit 5 \
            "reference retrieval visual dna render critic" | tee semantic-smoke-artifacts/query.json
          python -m src.semantic_index benchmark --live --iterations 3 | tee semantic-smoke-artifacts/benchmark.json

      - name: Assert physical semantic-plane gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("semantic-smoke-artifacts")
          doctor = json.loads((root / "doctor.json").read_text())
          index = json.loads((root / "index.json").read_text())
          graphify = json.loads((root / "graphify.json").read_text())
          query = json.loads((root / "query.json").read_text())
          benchmark = json.loads((root / "benchmark.json").read_text())

          assert doctor["ok"] is True, doctor
          assert doctor["ollama"]["embedding_contract_ok"] is True, doctor
          assert doctor["ollama"]["probe_dims"] == 1024, doctor
          reports = index["reports"]
          assert len(reports) == 1 and reports[0]["upserted"] > 0, index
          assert graphify["nodes_updated"] > 0, graphify
          assert graphify["query_batches"] > 0, graphify
          assert query["hits"], query
          assert query["active_retrieval_levels"] == ["L8", "L9", "L10", "L11", "L12"], query
          assert benchmark["synthetic"]["passed"] is True, benchmark
          assert benchmark["live"]["passed"] is True, benchmark
          assert benchmark["passed"] is True, benchmark
          print("PHYSICAL_SEMANTIC_PLANE=PASS")
          PY

      - name: Capture service diagnostics
        if: always()
        run: |
          mkdir -p semantic-smoke-artifacts
          docker logs semantic-ollama > semantic-smoke-artifacts/ollama.log 2>&1 || true
          docker logs semantic-qdrant > semantic-smoke-artifacts/qdrant.log 2>&1 || true
          docker ps -a > semantic-smoke-artifacts/docker-ps.txt || true

      - name: Upload physical smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-live-smoke-${{ github.sha }}
          path: semantic-smoke-artifacts/
          if-no-files-found: error
          retention-days: 14
