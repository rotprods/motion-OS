name: Runtime Smoke (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove runner startup
        run: |
          set -euo pipefail
          echo "runner-started"
          uname -a
          python --version
          node --version || true
          ffmpeg -version | head -1 || true
