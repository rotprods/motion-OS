name: Runtime Smoke (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: Prove runner startup
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prove runner startup
        run: |
          set -euo pipefail
          echo "runner-started"
          uname -a
          python --version
          node --version || true
          ffmpeg -version | head -1 || true
