name: Main Lineage Sentinel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: main-lineage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
      - name: Verify exact main commit against merged PR metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m scripts.main_lineage_sentinel \
            --branch main --json-out .artifacts/main-lineage.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: main-lineage-evidence
          path: .artifacts/main-lineage.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
