name: Security Baseline
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - name: Build frozen security environment
        run: python scripts/python_ci_env.py create --environment security --json-out .artifacts/security-baseline-environment.json
      - name: Audit Python and static security surfaces
        run: .venv-ci/security/bin/python scripts/local_verify.py security --skip-install-check --json-out .artifacts/security-baseline.json
      - name: Audit exact Remotion npm lock
        run: .venv-ci/security/bin/python scripts/npm_audit_gate.py --json-out .artifacts/security-baseline-npm-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-baseline-evidence
          path: |
            .artifacts/security-baseline-environment.json
            .artifacts/security-baseline.json
            .artifacts/security-baseline-npm-audit.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
