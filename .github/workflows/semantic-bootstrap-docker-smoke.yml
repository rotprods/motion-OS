name: Semantic Bootstrap Docker Smoke

on:
  pull_request:
    paths:
      - "scripts/bootstrap_semantic_plane.sh"
      - "compose.semantic.yml"
      - "tests/test_semantic_bootstrap_contract.py"
      - ".github/workflows/semantic-bootstrap-docker-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-bootstrap-docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-fallback:
    name: Docker-only Ollama + Qdrant bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLLAMA_URL: http://127.0.0.1:11434
      OLLAMA_EMBED_MODEL: bge-m3
      OLLAMA_DOCKER_IMAGE: ollama/ollama:0.33.2
      OLLAMA_DOCKER_CONTAINER: motion-semantic-ollama
      OLLAMA_DOCKER_VOLUME: motion_ollama_models
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: semantic_bootstrap_ci_v1
      SEMANTIC_BATCH_SIZE: "4"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Require Docker-only fallback precondition
        run: |
          set -euo pipefail
          docker version
          docker compose version
          if command -v ollama >/dev/null 2>&1; then
            echo "Hosted runner unexpectedly contains an Ollama CLI; Docker fallback would not be exercised." >&2
            exit 1
          fi

      - name: Bootstrap semantic plane from Docker only
        run: |
          set -euo pipefail
          mkdir -p semantic-bootstrap-artifacts
          bash scripts/bootstrap_semantic_plane.sh | tee semantic-bootstrap-artifacts/bootstrap.log
          python -m src.semantic_index doctor | tee semantic-bootstrap-artifacts/doctor.json

      - name: Assert bootstrap topology and model contract
        run: |
          set -euo pipefail
          test "$(docker inspect -f '{{.Config.Image}}' motion-semantic-ollama)" = "ollama/ollama:0.33.2"
          docker port motion-semantic-ollama 11434/tcp | grep -Fx '127.0.0.1:11434'
          docker port motion-semantic-qdrant 6333/tcp | grep -Fx '127.0.0.1:6333'
          curl -fsS http://127.0.0.1:11434/api/tags | tee semantic-bootstrap-artifacts/ollama-tags.json
          python - <<'PY'
          import json
          from pathlib import Path

          doctor = json.loads(Path('semantic-bootstrap-artifacts/doctor.json').read_text())
          assert doctor['ok'] is True, doctor
          assert doctor['ollama']['model_present'] is True, doctor
          assert doctor['ollama']['embedding_contract_ok'] is True, doctor
          assert doctor['ollama']['probe_dims'] == 1024, doctor
          assert doctor['qdrant']['ok'] is True, doctor
          vectors = doctor['qdrant']['collection_state']['response'].get('result')
          print('SEMANTIC_DOCKER_BOOTSTRAP=PASS')
          PY

      - name: Capture container diagnostics
        if: always()
        run: |
          mkdir -p semantic-bootstrap-artifacts
          docker ps -a > semantic-bootstrap-artifacts/docker-ps.txt || true
          docker logs motion-semantic-ollama > semantic-bootstrap-artifacts/ollama.log 2>&1 || true
          docker logs motion-semantic-qdrant > semantic-bootstrap-artifacts/qdrant.log 2>&1 || true

      - name: Cleanup
        if: always()
        run: |
          docker rm -f motion-semantic-ollama >/dev/null 2>&1 || true
          docker compose -f compose.semantic.yml down -v >/dev/null 2>&1 || true

      - name: Upload bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semantic-bootstrap-docker-${{ github.sha }}
          path: semantic-bootstrap-artifacts/
          if-no-files-found: error
          retention-days: 14
