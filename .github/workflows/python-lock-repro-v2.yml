name: Python Lock Reproducibility v2

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'pyproject.toml'
      - 'pylock.py311-dev.toml'
      - 'pylock.py312-dev.toml'
      - 'pylock.py312-analysis.toml'
      - 'pylock.py312-audit.toml'
      - 'ci/python_environments.json'
      - 'scripts/python_ci_env.py'
      - 'tests/test_python_ci_env.py'
      - '.github/workflows/python-lock-repro-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-lock-repro-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate ${{ matrix.lock_name }} byte-identically
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            kind: project
            extras: 'dev'
            lock_name: 'pylock.py311-dev.toml'
          - python: '3.12.14'
            kind: project
            extras: 'dev'
            lock_name: 'pylock.py312-dev.toml'
          - python: '3.12.14'
            kind: project
            extras: 'dev,analysis'
            lock_name: 'pylock.py312-analysis.toml'
          - python: '3.12.14'
            kind: audit
            extras: ''
            lock_name: 'pylock.py312-audit.toml'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pin exact lock generator
        run: python -m pip install --disable-pip-version-check 'pip==26.2.1'
      - name: Regenerate and compare
        env:
          LOCK_KIND: ${{ matrix.kind }}
          LOCK_EXTRAS: ${{ matrix.extras }}
          LOCK_NAME: ${{ matrix.lock_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          generated=".artifacts/${LOCK_NAME%.toml}-generated.toml"
          if [[ "$LOCK_KIND" == project ]]; then
            deps="pylock._deps-${LOCK_NAME#pylock.}"
            build="pylock._build-${LOCK_NAME#pylock.}"
            python -m pip lock --only-deps -e ".[${LOCK_EXTRAS}]" -o "$deps"
            python -m pip lock 'setuptools==84.0.0' -o "$build"
            python -m pip lock -r "$deps" -r "$build" -o "$generated"
          else
            python -m pip lock 'pip-audit==2.10.1' -o "$generated"
          fi
          diff -u "$LOCK_NAME" "$generated" > ".artifacts/${LOCK_NAME}.diff" || true
          python - "$LOCK_NAME" "$generated" <<'PY'
          from pathlib import Path
          import hashlib, json, sys
          committed, generated = map(Path, sys.argv[1:])
          a, b = committed.read_bytes(), generated.read_bytes()
          receipt = {
              'schema': 'motion-os.python-lock-regeneration/v3',
              'status': 'PASS' if a == b else 'DRIFT',
              'lock_name': committed.name,
              'committed_match': a == b,
              'committed_sha256': hashlib.sha256(a).hexdigest(),
              'generated_sha256': hashlib.sha256(b).hexdigest(),
              'committed_bytes': len(a),
              'generated_bytes': len(b),
          }
          Path(f'.artifacts/{committed.name}.regeneration.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, sort_keys=True))
          if a != b:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: regen-v2-${{ matrix.lock_name }}
          path: |
            .artifacts/${{ matrix.lock_name }}.regeneration.json
            .artifacts/${{ matrix.lock_name }}.diff
            .artifacts/pylock.*-generated.toml
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7

  reproduce:
    name: Double clean venv ${{ matrix.environment }}
    needs: regenerate
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11.16'
            environment: quick311
          - python: '3.12.14'
            environment: quick312
          - python: '3.12.14'
            environment: analysis
          - python: '3.12.14'
            environment: security
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Create first clean environment
        run: python scripts/python_ci_env.py create --environment '${{ matrix.environment }}' --venv '.venv-ci/${{ matrix.environment }}-1' --json-out '.artifacts/${{ matrix.environment }}-1.json'
      - name: Create second clean environment
        run: python scripts/python_ci_env.py create --environment '${{ matrix.environment }}' --venv '.venv-ci/${{ matrix.environment }}-2' --json-out '.artifacts/${{ matrix.environment }}-2.json'
      - name: Require identical inventories
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          name = os.environ['ENVIRONMENT']
          a = json.loads(Path(f'.artifacts/{name}-1.json').read_text())
          b = json.loads(Path(f'.artifacts/{name}-2.json').read_text())
          if a.get('status') != 'PASS' or b.get('status') != 'PASS':
              raise SystemExit('environment did not pass')
          if a.get('inventory_sha256') != b.get('inventory_sha256'):
              raise SystemExit('clean environment inventory drift')
          if a.get('installed_inventory') != b.get('installed_inventory'):
              raise SystemExit('clean environment inventory mismatch')
          print(json.dumps({'status':'PASS','environment':name,'inventory_sha256':a['inventory_sha256']}, sort_keys=True))
          PY
      - name: Run canonical environment regression tests
        run: '.venv-ci/${{ matrix.environment }}-1/bin/python -m pytest -q tests/test_python_ci_env.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: repro-v2-${{ matrix.environment }}
          path: .artifacts/${{ matrix.environment }}-*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
