name: Python Lock Bootstrap Cleanup Audit

on:
  workflow_dispatch:

permissions:
  contents: read

# Historical versions of this workflow deleted files and workflow definitions
# from the active PR branch via GITHUB_TOKEN. Validation workflows must be
# observational only. This job now reports the cleanup candidate set; actual
# deletion must happen in an explicit reviewed commit.

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify canonical lock bytes
        run: |
          set -euo pipefail
          printf '%s  %s\n' '4ebe8e5a5beb027d02824a67c3d00b8c4c0bef9c08e0cb14b96ed9182543aebe' pylock.py311-dev.toml | sha256sum --check --strict
          printf '%s  %s\n' 'af5afbc2ee43f8719e0343a26e7ca0062d32a7a0f459c55c9e51d68d515c8f41' pylock.py312-dev.toml | sha256sum --check --strict
          printf '%s  %s\n' 'c532a7e0d48fd2e43cda6a459685fd8aeb3f61da24e45f8eced46c7187c31388' pylock.py312-analysis.toml | sha256sum --check --strict
          printf '%s  %s\n' '6c111783b033ebd8a6e859ce732d8fc35293905a2bb6ee8b62111515bfae1747' pylock.py312-audit.toml | sha256sum --check --strict
      - name: Report superseded bootstrap surfaces without mutation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          candidates=(
            pylock.py312-security.toml
            ci/python_toolchain.json
            scripts/python_lock_gate.py
            tests/test_python_lock_gate.py
            scripts/python_environment.py
            tests/test_python_environment.py
            .github/workflows/python-lock-bootstrap.yml
            .github/workflows/python-lock-installable-probe.yml
            .github/workflows/python-environment-smoke.yml
            .github/workflows/python-lock-promote.yml
            .github/workflows/python-lock-promote-v2.yml
            .github/workflows/python-lock-bootstrap-cleanup.yml
          )
          : > .artifacts/python-bootstrap-cleanup-candidates.txt
          for path in "${candidates[@]}"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              printf 'TRACKED\t%s\n' "$path" | tee -a .artifacts/python-bootstrap-cleanup-candidates.txt
            else
              printf 'ABSENT\t%s\n' "$path" | tee -a .artifacts/python-bootstrap-cleanup-candidates.txt
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-bootstrap-cleanup-audit
          path: .artifacts/python-bootstrap-cleanup-candidates.txt
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
