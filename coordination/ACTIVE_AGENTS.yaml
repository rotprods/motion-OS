bootstrap_rules:
  - This file is a bootstrap read model, never write authority.
  - Live GitHub lifecycle plus valid canonical event semantics supersede stale lifecycle projections.
  - A projection_base_sha is provenance for this snapshot, not a claim that main is still at that SHA.
  - PR closed, merged, CI-green, deployed and verified are distinct lifecycle/assurance facts.
  - GitHub lifecycle drift invalidates ContextPacks that depend on this topology.
  - Session identity and resource-scope preflight are mandatory before protected writes.
  - Phase06 SQLite/WAL remains single-host authority; Phase07 reference/local coordination does not imply multi-host authority.
  - COS/Unified Graph is derived and rebuildable and cannot authorize reverse writes.
