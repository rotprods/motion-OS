[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-os"
version = "0.9.1"
description = "Autonomous motion-design production operating system"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23"]
vision = ["numpy>=1.26", "opencv-python-headless>=4.10", "pytesseract>=0.3.13"]
transcription = ["openai-whisper"]
analysis = ["numpy>=1.26", "opencv-python-headless>=4.10", "pytesseract>=0.3.13"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
